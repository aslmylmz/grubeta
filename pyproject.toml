[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grubeta"
version = "0.1.1"
description = "GRU-based Dynamic Beta Estimation for Time-Varying Systematic Risk"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ahmet Selim Yılmaz", email = 'selim.yilmaz@metu.edu.tr'}
]
maintainers = [
    {name = "Ahmet Selim Yılmaz", email = "selim.yilmaz@metu.edu.tr"}
]
keywords = [
    "beta",
    "capm",
    "dynamic beta",
    "gru",
    "neural network",
    "systematic risk",
    "time-varying beta",
    "financial modeling",
    "quantitative finance",
    "machine learning",
    "deep learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "tensorflow>=2.10.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
full = [
    "ta>=0.10.0",
    "statsmodels>=0.13.0",
    "seaborn>=0.12.0",
    "scipy>=1.9.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "nbsphinx>=0.9.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "nbsphinx>=0.9.0",
    "myst-parser>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/aslmylmz/grubeta"
Documentation = "https://grubeta.readthedocs.io"
Repository = "https://github.com/aslmylmz/grubeta"
Changelog = "https://github.com/aslmylmz/grubeta/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/aslmylmz/grubeta/issues"

[tool.setuptools]
packages = ["grubeta"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
grubeta = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=grubeta --cov-report=term-missing"

[tool.coverage.run]
source = ["grubeta"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
